name: Generate Contribution Snake

on:
  # Run once per day automatically
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC = 23:30 IST
  # Allow manual trigger from Actions tab
  workflow_dispatch:
  # Also run on any push to main (initial setup)
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate Snake SVG (dark + light)
        uses: Platane/snk@v3
        with:
          github_user_name: Kata-rahul15
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
